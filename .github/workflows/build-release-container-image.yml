name: Build and publish the release container images

on:
  workflow_dispatch:
  push:
    branches: [ "release" ]
    paths:
    - '.dockerignore'
    - 'src/ServiceBusViewer/**'
    - 'src/ServiceBusViewer.Web/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
        - image_name: ServiceBusViewer
          dockerfile: ./src/ServiceBusViewer/Dockerfile
        - image_name: servicebusviewer-web
          dockerfile: ./src/ServiceBusViewer.Web/Dockerfile

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Extract version
      id: version
      run: |
        VERSION=$(dotnet msbuild src/ServiceBusViewer/ServiceBusViewer.csproj -getProperty:Version -nologo 2>/dev/null | tail -n 1 | xargs)

        if [ -z "$VERSION" ]; then
          echo "Failed to extract version from csproj" >&2
          exit 1
        fi

        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format: $VERSION" >&2
          exit 1
        fi

        echo "Extracted version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: |
          ghcr.io/veselovandrey/${{ matrix.image_name }}:latest
          ghcr.io/veselovandrey/${{ matrix.image_name }}:${{ steps.version.outputs.version }}
