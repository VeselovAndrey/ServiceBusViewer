<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Browse, inspect, receive, and send messages with Azure Service Bus and its local emulator." />
  <meta name="application-name" content="Service Bus Viewer" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter/inter-latin-400-normal.woff2" fetchpriority="high"
    crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono/jetbrains-mono-latin-400-normal.woff2"
    fetchpriority="low" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/material-icons/MaterialIcons-Regular.woff2"
    fetchpriority="low" crossorigin />
  <title>Service Bus Viewer</title>
  <script>
    (function () {
      try {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content =
            storedTheme;
        }
      } catch {
        // Persistence unavailable (e.g. site data blocked); the page still
        // follows the system color scheme.
      }
    })();
  </script>
</head>

<body>
  <noscript>Service Bus Viewer requires JavaScript to run.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
